<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wedding Gallery | Whan & Pre</title>
  <meta name="description" content="แกลเลอรี่งานแต่ง Whan & Pre — โหลดต่อเนื่องและเปิดภาพขยาย" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Itim&family=Julius+Sans+One&family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/lightbox2@2.11.5/dist/css/lightbox.min.css" rel="stylesheet">
  <style>
    :root{--bg:#f9f3f3;--fg:#3a2e2e;--muted:#7d5a5a;--card:#fff;--accent:#b48a64}
    body{font-family:'Julius Sans One','Kanit',system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans Thai',sans-serif;color:var(--fg);background:var(--bg)}
    header{padding:36px 0 8px;text-align:center}
    header h1{font-size:2.2rem;margin:0 0 6px}
    header p{margin:0;color:var(--muted)}
    .masonry{column-gap:16px;max-width:1200px;margin:18px auto 40px}
    @media(min-width:640px){.masonry{columns:2}}
    @media(min-width:900px){.masonry{columns:3}}
    @media(min-width:1280px){.masonry{columns:4}}
    figure{break-inside:avoid;margin:0 0 16px;position:relative}
    figure img{width:100%;height:auto;display:block;border-radius:14px;background:#eee}
    figcaption{font-size:13px;color:var(--muted);margin-top:6px;padding:0 4px}
    .loader{display:none;justify-content:center;align-items:center;margin:18px 0}
    .loader.show{display:flex}
    .btn-back{display:inline-block;margin:12px auto 0;text-align:center}
  </style>
</head>
<body>
  <header class="container">
    <h1>Whan & Pre — Wedding Gallery</h1>
    <p>เลื่อนลงเพื่อโหลดเพิ่ม (รองรับรูปนับพัน)</p>
    <p><a class="btn btn-outline-secondary btn-sm btn-back" href="index.html">← กลับหน้าแรก</a></p>
  </header>

  <main id="gallery" class="masonry"></main>
  <div id="loader" class="loader"><div class="spinner-border" role="status"><span class="visually-hidden">Loading…</span></div></div>

  <script src="https://cdn.jsdelivr.net/npm/lightbox2@2.11.5/dist/js/lightbox-plus-jquery.min.js"></script>
  <script src="assets/gallery.js"></script>
</body>
</html>
