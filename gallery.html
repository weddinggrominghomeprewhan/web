<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wedding Gallery | Whan & Pre</title>
  <meta name="description" content="Whan & Pre — Wedding Gallery" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Itim&family=Julius+Sans+One&family=Kanit:wght@300;400;600&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/lightbox2@2.11.5/dist/css/lightbox.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f9f3f3;
      --fg: #3a2e2e;
      --muted: #7d5a5a;
      --gap: 12px
    }

    * {
      box-sizing: border-box
    }

    body {
      font-family: 'Julius Sans One', 'Kanit', system-ui, -apple-system, Segoe UI, Roboto, 'Noto Sans Thai', sans-serif;
      color: var(--fg);
      background: var(--bg);
      margin: 0;
    }

    /* แก้เป็น */
    header {
      padding: 20px 0 8px;
      text-align: center;
      border-bottom: 1px solid #eee;
      background: var(--bg);
    }

    header h1 {
      font-size: 1.2rem;
      margin: 0 0 4px
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: .9rem
    }

    .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 10px
    }

    #gallery {
      position: relative;
      min-height: 200px
    }

    .tile {
      position: absolute;
      border-radius: 12px;
      overflow: hidden;
      background: #eee;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
    }

    .tile a {
      display: block
    }

    .tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    /* full-width ภาพเต็มแถว → แสดงเต็มภาพไม่ครอป */
    .tile.full img {
      object-fit: contain;
      background: #eee;
    }

    .loader {
      display: none;
      justify-content: center;
      align-items: center;
      margin: 16px 0
    }

    .loader.show {
      display: flex
    }

    @media (min-width:900px) {
      .wrap {
        max-width: 1200px
      }
    }

    @media (min-width:1280px) {
      .wrap {
        max-width: 1400px
      }
    }

    #btnTop {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: #c7a58a;
      color: white;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0, 0, 0, .25);
      opacity: 0;
      pointer-events: none;
      transition: opacity .4s, transform .4s;
      z-index: 50;
    }

    #btnTop:hover {
      background: #a88364;
      transform: scale(1.08);
    }

    #btnTop.show {
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width:640px) {
      #btnTop {
        width: 44px;
        height: 44px;
        bottom: 18px;
        right: 18px;
        font-size: 20px;
      }
    }

    /* ปุ่มดาวน์โหลดซ้อนบนรูป */
    .tile .dl-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 10px;
      background: rgba(0, 0, 0, .55);
      color: #fff;
      font-size: 18px;
      line-height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .25);
      transition: transform .12s, opacity .12s;
    }

    .tile .dl-btn:active {
      transform: scale(.96);
    }

    .tile:hover .dl-btn {
      opacity: 1;
    }

    @media (max-width:640px) {
      .tile .dl-btn {
        width: 32px;
        height: 32px;
        font-size: 16px;
      }
    }
    /* ปุ่มดาวน์โหลดใน Lightbox */
.lb-download {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 10000;
  border: none;
  border-radius: 10px;
  width: 38px;
  height: 38px;
  background: rgba(0, 0, 0, .6);
  color: #fff;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .25);
}
.lb-download:active {
  transform: scale(.96);
}

  </style>
</head>

<body>
  <header class="container">
    <h1>Whan & Pre — Wedding Gallery</h1>
    </br>
    <h1 style="margin-bottom: 15px; font-size: 10px;">
      Total Photos: <span id="total-photos">...</span>
  </h1>
    <p><a class="btn btn-outline-secondary btn-sm btn-back" href="index.html">← กลับหน้าแรก</a></p>
  </header>


  <div class="wrap">
    <main id="gallery" aria-live="polite"></main>
    <div id="loader" class="loader">
      <div class="spinner-border" role="status"><span class="visually-hidden">Loading…</span></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/lightbox2@2.11.5/dist/js/lightbox-plus-jquery.min.js"></script>
  <script src="assets/gallery.js"></script>
  <button id="btnTop" title="กลับขึ้นบน">↑</button>

  <script>
    const btnTop = document.getElementById('btnTop');
    window.addEventListener('scroll', () => {
      // โชว์ปุ่มเมื่อเลื่อนลงเกิน 400px
      if (document.documentElement.scrollTop > 400) btnTop.classList.add('show');
      else btnTop.classList.remove('show');
    });
    btnTop.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ปุ่มดาวน์โหลดรูป
/* document.getElementById('gallery').addEventListener('click', (e) => {
  const btn = e.target.closest('.dl-btn');
  if (!btn) return;
  const url = btn.getAttribute('data-url');
  if (!url) return;

  const a = document.createElement('a');
  a.href = url;
  a.download = '';
  document.body.appendChild(a);
  a.click();
  a.remove();
}); */
// --- ส่วนจัดการดาวน์โหลดและแปลงเป็น PNG (แก้ไขใหม่) ---
document.getElementById('gallery').addEventListener('click', async (e) => {
      const btn = e.target.closest('.dl-btn');
      if (!btn) return;
      
      const url = btn.getAttribute('data-url');
      if (!url) return;

      // ป้องกันการกดซ้ำระหว่างประมวลผล
      if (btn.dataset.processing) return;

      try {
        // 1. แจ้งสถานะว่ากำลังทำงาน (เปลี่ยนไอคอนชั่วคราว)
        btn.dataset.processing = "true";
        const originalText = btn.innerText;
        btn.innerText = "⏳"; // แสดงรูปนาฬิกาทราย หรือ ...

        // 2. โหลดรูปภาพเข้ามาใน Memory
        const img = new Image();
        // สำคัญ: ต้องใส่ crossOrigin เพื่อให้ Canvas ยอมให้ save รูปข้ามโดเมนได้ (ถ้าโฮสต์รองรับ)
        img.crossOrigin = "anonymous"; 
        img.src = url;

        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
        });

        // 3. สร้าง Canvas และวาดรูปลงไป
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        // 4. ตั้งชื่อไฟล์ใหม่ (เอาชื่อเดิมมาเปลี่ยนนามสกุลเป็น .png)
        let filename = url.split('/').pop().split('?')[0]; // ตัด query string ออก
        const namePart = filename.substring(0, filename.lastIndexOf('.')) || filename;
        const newFilename = `${namePart}.png`;

        // 5. แปลงเป็น Blob (PNG) และสั่งดาวน์โหลด
        canvas.toBlob((blob) => {
          if (!blob) throw new Error('Conversion failed');
          
          const a = document.createElement('a');
          const objectUrl = URL.createObjectURL(blob);
          a.href = objectUrl;
          a.download = newFilename; // บังคับชื่อไฟล์ .png
          document.body.appendChild(a);
          a.click();
          
          // Cleanup
          document.body.removeChild(a);
          URL.revokeObjectURL(objectUrl);
          
          // คืนค่าปุ่ม
          btn.innerText = originalText;
          delete btn.dataset.processing;
        }, 'image/png'); // ระบุ format ที่ต้องการตรงนี้

      } catch (err) {
        console.error("PNG conversion failed, falling back to direct download", err);
        // กรณีแปลงไม่สำเร็จ (เช่น ติด CORS) ให้ดาวน์โหลดแบบปกติแทน
        const a = document.createElement('a');
        a.href = url;
        a.download = '';
        document.body.appendChild(a);
        a.click();
        a.remove();
        
        // คืนค่าปุ่ม
        btn.innerText = e.target.closest('.dl-btn').innerText; // คืนค่าเดิม
        delete btn.dataset.processing;
      }
    });
    // --- เพิ่มส่วนนี้: ดึงจำนวนรูปมาแสดง ---
    fetch('manifests/meta.json')
      .then(response => response.json())
      .then(data => {
        // แสดงตัวเลขแบบมีลูกน้ำ (เช่น 1,200)
        document.getElementById('total-photos').innerText = data.total.toLocaleString();
      })
      .catch(err => {
        console.error("Error loading meta.json", err);
        document.getElementById('total-photos').innerText = ""; 
      });

  </script>
  
  
</body>

</html>
